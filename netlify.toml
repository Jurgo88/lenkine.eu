[build]
  publish = "."
  command = ""

# Staré URL z WordPress webu → sekcie nového jednostránkového webu
[[redirects]]
  from = "/knihy-na-predaj/*"
  to = "/#knihy"
  status = 301
[[redirects]]
  from = "/obrazy-na-predaj/*"
  to = "/#obrazy"
  status = 301
[[redirects]]
  from = "/ghostwriting/*"
  to = "/#ghostwriting"
  status = 301
[[redirects]]
  from = "/herectvo/*"
  to = "/#herectvo"
  status = 301
[[redirects]]
  from = "/kontakt/*"
  to = "/#kontakt"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2024/12/skh-1-11.pdf"
  to = "/docs/svokra-kebab-hollywood-ukazka.pdf"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
